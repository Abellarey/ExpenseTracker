<div class="page-header">
  <div>
    <h1>Categories</h1>
    <p>Use the built-in categories or create your own.</p>
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-4">
    <div class="card panel">
      <div class="card-header panel-header">
        <h5>{{ editingId() ? 'Edit category' : 'New category' }}</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="category-name">Name</label>
            <input id="category-name" class="form-control" formControlName="name" placeholder="e.g. Pets" />
            <div class="field-error" *ngIf="form.controls.name.invalid && form.controls.name.touched">Use 2 to 40 characters.</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="category-type">Type</label>
            <select id="category-type" class="form-select" formControlName="type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-success flex-fill" type="submit" [disabled]="saving()">
              {{ editingId() ? 'Update category' : 'Create category' }}
            </button>
            <button class="btn btn-outline-secondary" type="button" *ngIf="editingId()" (click)="cancelEdit()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-12 col-lg-8">
    <div class="card panel">
      <div class="card-header panel-header">
        <h5>All categories</h5>
        <small>{{ categories().length }} total</small>
      </div>

      <div *ngIf="loading()" class="card-body text-center py-5"><div class="spinner-border spinner-border-sm text-success" role="status"></div></div>

      <div class="table-responsive" *ngIf="!loading()">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Source</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let category of categories()">
              <td><strong>{{ category.name }}</strong></td>
              <td>
                <span class="badge" [ngClass]="category.type === 'income' ? 'text-bg-success' : 'text-bg-secondary'">{{ category.type }}</span>
              </td>
              <td>
                <span class="badge badge-builtin" *ngIf="category.isDefault">Predefined</span>
                <span class="text-muted small" *ngIf="!category.isDefault">Custom</span>
              </td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary" type="button" *ngIf="!category.isDefault" (click)="edit(category)" title="Edit"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" type="button" *ngIf="!category.isDefault" (click)="deleteCategory(category)" title="Delete"><i class="bi bi-trash"></i></button>
                <span class="text-muted small" *ngIf="category.isDefault">Locked</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
